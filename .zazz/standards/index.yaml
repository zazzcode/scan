#   rule-authoring.md  .scm query conventions, rule naming, sink classes, OWASP/CWE/severity declaration
#   graph-model.md     node/edge schema evolution, node identity, graph export compatibility
#   arg-binding.md     call-site argument annotation conventions and the local binding table
#   llm-broker.md      prompt shape, structured response schema, verdict semantics, retry and cost control
#   finding-record.md  finding schema, fingerprint, previous-findings log, baseline format, gating policy
#   cli-surface.md     flags, output formats, exit codes, CI usage
#   ci-workflows.md    GitHub Actions triggers, Go build/vet/test/race jobs, lint and format gates
#   observability.md   structured logging and progress reporting for long scans
